<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>pixi-charts — ScatterChart performance harness</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 16px;
        color: #222;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      #controls {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      button {
        font: inherit;
        padding: 6px 12px;
        border: 1px solid #bbb;
        border-radius: 6px;
        background: #f6f6f6;
        cursor: pointer;
      }
      button.active {
        background: #1f77b4;
        color: #fff;
        border-color: #1f77b4;
      }
      #stats {
        display: flex;
        gap: 24px;
        font-variant-numeric: tabular-nums;
        margin-bottom: 12px;
      }
      #stats b {
        font-size: 20px;
      }
      #chart {
        width: 900px;
        height: 560px;
        border: 1px solid #eee;
      }
      .meta {
        color: #888;
        font-size: 12px;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <h1>ScatterChart performance harness</h1>
    <div id="controls">
      <span>Points:</span>
      <button data-n="1000">1k</button>
      <button data-n="10000">10k</button>
      <button data-n="100000" class="active">100k</button>
      <button data-n="1000000">1M</button>
    </div>
    <div id="stats">
      <span>FPS: <b id="fps">—</b></span>
      <span>render(): <b id="rt">—</b> ms</span>
      <span>Points: <b id="count">—</b></span>
    </div>
    <div id="chart"></div>
    <p class="meta" id="meta"></p>
    <script type="module" src="scatter-perf.js"></script>
  </body>
</html>
